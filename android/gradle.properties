# Gradle properties for Android project
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# JDK Configuration - Use Java 17 (required for Android Gradle Plugin)
# Android Gradle Plugin 8.1.0+ requires Java 17 to run
# Uncomment one of these options:

# Option 1: Use Android Studio's bundled JDK (recommended)
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Option 2: Use manually installed JDK 17  
# Download from: https://adoptium.net/temurin/releases/?version=17
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.x.x.x-hotspot

# Current system has Java 11 which is incompatible
# For command line builds, install Java 17 or use Android Studio

# Performance optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Disable unnecessary output
org.gradle.console=plain
