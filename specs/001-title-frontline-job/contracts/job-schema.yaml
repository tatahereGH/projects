openapi: 3.0.0
info:
  title: Frontline Job Finder Contracts
  version: 0.1.0
paths:
  /jobs:
    get:
      summary: Fetch jobs for the authenticated user
      responses:
        '200':
          description: A list of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
components:
  schemas:
    Job:
      type: object
      properties:
        id:
          type: string
        school:
          type: string
        date:
          type: string
          format: date
        dayLength:
          type: string
        classOrGrade:
          type: string
        teacher:
          type: string
        subject:
          type: string
        description:
          type: string
      required: [id, school, date]
