name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'
          ndk: ''
          cache: true

      - name: Run Gradle tasks (ktlint, assemble, tests) with Gradle action
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'
          arguments: ktlintCheck :app:assembleDebug test
        continue-on-error: false

