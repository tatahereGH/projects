name: Android CI

on:
  push:
    # include main branches and feature branches (feat/*)
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]
  # allow manual workflow dispatch
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'
          ndk: ''
          cache: true

      - name: Cache Gradle & Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
            ~/.android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK components & accept licenses
        shell: bash
        run: |
          echo "Installing Android SDK components"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" || true

      - name: Diagnostic - list repo & gradle wrapper
        shell: bash
        run: |
          echo "Repository root contents:"
          ls -la
          echo "Looking for gradle wrapper files:"
          ls -la gradle || true
          ls -la gradle/wrapper || true
          echo "gradlew script exists:"
          if [ -f ./gradlew ]; then echo "gradlew exists"; else echo "gradlew missing"; fi
          echo "Attempting to run ./gradlew --version (may fail if wrapper missing):"
          if [ -x ./gradlew ]; then ./gradlew --version || true; else echo "gradlew not executable or missing"; fi

      - name: Run Gradle tasks (ktlint, assemble, tests) with Gradle action
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'
          arguments: ktlintCheck :app:assembleDebug test
        continue-on-error: false

