name: Android CI

on:
  push:
    # include main branches and feature branches (feat/*)
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]
  # allow manual workflow dispatch
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'
          ndk: ''
          cache: true

      - name: Cache Gradle & Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
            ~/.android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK components & accept licenses
        shell: bash
        run: |
          echo "Installing Android SDK components"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" || true

      - name: Diagnostic - list repo & gradle wrapper
        shell: bash
        run: |
          echo "Repository root contents:"
          ls -la
          echo "Android directory contents:"
          ls -la android/ || true
          echo "Looking for gradle wrapper files in android/:"
          ls -la android/gradle || true
          ls -la android/gradle/wrapper || true
          echo "gradlew script exists in android/:"
          if [ -f android/gradlew ]; then echo "android/gradlew exists"; else echo "android/gradlew missing"; fi
          echo "Attempting to run android/gradlew --version:"
          if [ -x android/gradlew ]; then cd android && ./gradlew --version || true; else echo "android/gradlew not executable or missing"; fi

      - name: Auto-fix ktlint formatting issues
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'
          arguments: ktlintFormat
          build-root-directory: android
        continue-on-error: true

      - name: List available Gradle tasks
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'
          arguments: tasks
          build-root-directory: android
        continue-on-error: true

      - name: Run Android assembleDebug only
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'
          arguments: :app:assembleDebug
          build-root-directory: android
        continue-on-error: false

